[package]
name = "tlinalg-blas"
description = "LAPACK/BLAS-backed tensor-free linear algebra kernels for the Tensor4all stack."
version = "0.5.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# The workspace default stays `false` so the unpublished crates (testkit, parity,
# bench) cannot be published by accident; these two opt in.
publish = true
# The SVD regression matrices are read at run time from the repository checkout; they are not
# part of the published library.
exclude = ["tests/data"]

[features]
default = []
# Select the `?gesvd` driver instead of `?gesdd`, matching tenferro's `provider-inject` symbol set:
# the injected LAPACK exports `?gesvd` but not `?gesdd`.
provider-inject = []
# The host links Apple Accelerate's LAPACK; select the `?gesvd` driver instead of `?gesdd`. The
# plain symbol names bind Accelerate's LAPACK 3.2.1 interface, whose `zgesdd` returns negative
# singular values and factors that do not reproduce the input for some complex matrices while
# reporting `info = 0` (see #110). The host enables this whenever it selects the Accelerate source;
# the target OS alone does not say which LAPACK is linked.
accelerate = []
# Link Apple Accelerate for this crate's own tests on macOS, through `build.rs`. Implies
# `accelerate`. Mutually exclusive with `link-openblas*` and `link-mkl`.
link-accelerate = ["accelerate"]
# Link OpenBLAS for this crate's own tests. Tenferro selects the source and the injected-symbol
# path itself; this feature only exists so the crate has an executable check of its own.
link-openblas = ["dep:blas-src", "dep:lapack-src"]
# The same vendor, linked statically. The benchmark campaign builds the harness out of the
# measured checkout and executes the binary directly, so it must not need a loader search path
# (`openblas-src` is a shared library by default and says so in its build output).
link-openblas-static = ["link-openblas", "dep:openblas-src", "openblas-src/static"]
# The installed Intel oneAPI MKL, found through `MKLROOT` by `build.rs`. Not the `blas-src`
# route: that one downloads its own MKL tree, and this crate already activates the OpenBLAS
# source on the same dependencies, which Cargo's additive features would leave enabled.
# `link-mkl` and `link-openblas*` are mutually exclusive; the harness refuses the combination.
link-mkl = []

[dependencies]
lapack = { workspace = true }
cblas-sys = { workspace = true }
strided-view = { workspace = true }
thiserror = { workspace = true }
num-complex = { workspace = true }

[dependencies.blas-src]
workspace = true
optional = true
features = ["openblas"]

[dependencies.lapack-src]
workspace = true
optional = true
features = ["openblas"]

# Referenced directly only to reach its `static` feature; `blas-src` already pulls it in for the
# `openblas` source. Cargo unifies the two declarations into one build.
[dependencies.openblas-src]
workspace = true
optional = true

[dev-dependencies]
tlinalg-testkit = { workspace = true }

[lints]
workspace = true
