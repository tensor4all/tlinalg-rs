[package]
name = "tlinalg-parity"
description = "Dev-only cross-provider parity tests: the same cases through tlinalg (faer) and tlinalg-blas (LAPACK)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# Link OpenBLAS so the LAPACK half can run. Without it the parity tests compile to nothing.
link-openblas = ["tlinalg-blas/link-openblas"]

[dependencies]
tlinalg = { workspace = true }
tlinalg-blas = { workspace = true }
tlinalg-testkit = { workspace = true }
# The batch token the faer half takes.
tcontract-exec = { workspace = true }
num-complex = { workspace = true }
rayon = { workspace = true }
strided-view = { workspace = true }

[dev-dependencies]
# The published 0.3.0 release: the bitwise-compatibility reference for the tlinalg wrappers
# (`tests/compat_030.rs`). It resolves its own registry `tcontract-exec`, named through the second
# dev-dependency. Kept here, not in `tlinalg`, because `cargo publish` rejects a crate that depends
# on `tcontract-exec` twice under different names.
tlinalg_030 = { package = "tlinalg", version = "=0.3.0" }
tcontract_exec_030 = { package = "tcontract-exec", version = "=0.3.0" }

[lints]
workspace = true
