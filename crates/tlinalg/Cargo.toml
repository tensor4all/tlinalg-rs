[package]
name = "tlinalg"
description = "faer-backed tensor-free linear-algebra kernels with their own borrowed I/O, scratch, parallelism and error vocabulary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# The workspace default stays `false` so the unpublished crates (testkit, parity,
# bench) cannot be published by accident; these two opt in.
publish = true

[dependencies]
faer = { workspace = true }
num-complex = { workspace = true }
rayon = { workspace = true }
strided-view = { workspace = true }
tcontract-exec = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tlinalg-testkit = { workspace = true }
# The published 0.3.0 release, used only by `tests/alloc_counts.rs` as the bitwise-compatibility
# reference for the borrowed-workspace wrappers. It resolves its own registry `tcontract-exec`, so
# the test names that `Exec` through the second dev-dependency (the two `Exec` types are distinct
# packages: this crate consumes the git revision the 0.3 chain pins).
tlinalg_030 = { package = "tlinalg", version = "=0.3.0" }
tcontract_exec_030 = { package = "tcontract-exec", version = "=0.3.0" }

[lints]
workspace = true
