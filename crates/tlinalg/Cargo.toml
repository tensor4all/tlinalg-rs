[package]
name = "tlinalg"
description = "faer-backed tensor-free linear-algebra kernels with their own borrowed I/O, scratch, parallelism and error vocabulary."
keywords = ["linear-algebra", "kernels", "blas", "hpc", "tensor"]
categories = ["mathematics", "science"]
documentation = "https://docs.rs/tlinalg"
version = "0.8.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# The workspace default stays `false` so the unpublished crates (testkit, parity,
# bench) cannot be published by accident; these two opt in.
publish = true

[dependencies]
faer = { workspace = true }
num-complex = { workspace = true }
threadteam = { workspace = true }
strided-view = { workspace = true }
tcontract-exec = { workspace = true, features = ["faer"] }
thiserror = { workspace = true }

[dev-dependencies]
# The ledger counts the tasks a token starts; tests assert `max_live <= budget`.
threadteam = { workspace = true, features = ["ledger"] }
tlinalg-testkit = { workspace = true }

[lints]
workspace = true