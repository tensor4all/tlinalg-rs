name: CI

on:
  push:
    branches: [main]
  pull_request:
  # macOS runs here, not on pull requests or pushes: see the macOS rows / `if:` below.
  schedule:
    - cron: "07 17 * * *"   # 17:07 UTC = 02:07 JST, daily; off the :00/:30 herd
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
# Cargo uses the machine's parallelism: the standard ubuntu-latest runner is a 4 vCPU VM, and a
# fixed `-j 16` oversubscribed it. OpenBLAS parallelises its own build.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Only threadteam starts tasks on a pool: a direct rayon dependency anywhere else is rejected.
  deny:
    name: cargo deny (bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The from-source OpenBLAS is built by one machine and executed by whatever restores it: a
      # SAPPHIRERAPIDS build restored onto a Milan runner made the linked tests die with SIGILL, so
      # the CPU model is part of the key, as is the profile (this job builds `target/debug`, the
      # test job `target/ci`, and one immutable entry cannot hold both). No prefix fallback: a
      # changed vendor configuration must be a miss, not a reuse of the previous build.
      - id: runner
        run: |
          echo "key=$(lscpu | sed -n 's/^Model name: *//p' | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: target/*/build/openblas-src-*
          key: openblas-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner.outputs.key }}-debug-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.runner.outputs.key }}
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features tlinalg-blas/link-openblas,tlinalg-blas/provider-inject,tlinalg-parity/link-openblas,tlinalg-bench/link-openblas -- -D warnings

      - if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: target/*/build/openblas-src-*
          key: openblas-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner.outputs.key }}-debug-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}

  # The LAPACK kernels need linked symbols. `link-openblas` builds OpenBLAS from source through
  # `openblas-src`, so no system package is required.
  test:
    name: cargo test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # See the `clippy` job for why the vendor cache key carries the CPU model, the profile and no
      # prefix fallback.
      - id: runner
        run: |
          echo "key=$(lscpu | sed -n 's/^Model name: *//p' | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: target/*/build/openblas-src-*
          key: openblas-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner.outputs.key }}-ci-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.runner.outputs.key }}
          save-if: ${{ github.event_name == 'push' }}
      # The C ABI test links the built library, so build the cdylib first (the same
      # prerequisite tcontract-capi documents for its own C test).
      - run: cargo build --profile ci -p tlinalg-capi
      - run: cargo test --workspace --profile ci --features tlinalg-blas/link-openblas,tlinalg-parity/link-openblas
      # The injected symbol set exports ?gesvd but not ?gesdd, so the other driver has to be
      # exercised too; OpenBLAS provides both symbols.
      - run: cargo test --workspace --profile ci --features tlinalg-blas/link-openblas,tlinalg-blas/provider-inject,tlinalg-parity/link-openblas
      # The cheap timing layer next to the allocation gates (tlinalg-rs#57): seconds, single-thread,
      # ratio-gated, and report-only without OVERHEAD_GATE.
      - name: overhead smoke
        run: RAYON_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 OVERHEAD_GATE=1 cargo bench -p tlinalg-bench --bench overhead_smoke
      # A red gate here has to say which CPU ran it and which vendor build it linked. The linked
      # tests have failed with SIGILL on a runner because the from-source OpenBLAS was built for
      # an ISA that runner cannot execute, and neither fact was visible in the log.
      - name: Host and vendor build (on failure)
        if: failure()
        run: |
          lscpu | head -20
          grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^avx2|^avx512|^fma' | tr '\n' ' '; echo
          find target -name Makefile.conf -path '*openblas*' -exec grep -HE '^(CORE|DYNAMIC_ARCH|NUM_THREADS|NO_AFFINITY)=' {} \; || true
          find target -name 'libopenblas*' | head
      - if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: target/*/build/openblas-src-*
          key: openblas-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner.outputs.key }}-ci-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}

  # Without a vendor library the faer provider still runs in full and the LAPACK marshalling still
  # has to compile.
  test-unlinked:
    name: cargo test (macos-latest, unlinked)
    runs-on: macos-latest
    # Daily schedule and manual dispatch only; see the `on:` comment above.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
      # As on the Linux lane: the C ABI test links the built library.
      - run: cargo build --profile ci -p tlinalg-capi
      - run: cargo test --workspace --profile ci

  # Accelerate's legacy `zgesdd` returns wrong factors for some complex matrices (#110); the SVD
  # suite checks the driver `link-accelerate` selects against the vendor's own LAPACK.
  test-accelerate:
    name: cargo test (macos-latest, Accelerate)
    runs-on: macos-latest
    # Daily schedule and manual dispatch only; see the `on:` comment above.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
      - run: cargo test -p tlinalg-blas --profile ci --features link-accelerate --test svd --lib

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  # Only the scheduled run has macOS rows, so a failure there is the macOS signal PR CI no longer
  # gives. One rolling issue, found by title. Manual dispatches report in the run only.
  report:
    name: Report a failing night
    needs: [test-unlinked, test-accelerate]
    if: ${{ always() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: File or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          label=ci-nightly
          title="Scheduled macOS nightly is failing"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf -v body '%s\n\n%s\n' \
            "The scheduled CI run (the only one with macOS rows) failed in [run ${GITHUB_RUN_ID}](${run_url}) on \`${GITHUB_SHA:0:8}\`." \
            "PR CI no longer runs on macOS; dispatch \`ci.yml\` on a fix branch (\`workflow_dispatch\`) to verify it."
          gh label create "$label" --repo "$GITHUB_REPOSITORY" --color d93f0b \
            --description "Scheduled macOS nightly" 2>/dev/null || true
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$label" --state open \
            --search "in:title \"$title\"" --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label "$label" --title "$title" --body "$body"
          fi
