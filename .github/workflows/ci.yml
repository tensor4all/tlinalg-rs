name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
# Cargo uses the machine's parallelism: the standard ubuntu-latest runner is a 4 vCPU VM, and a
# fixed `-j 16` oversubscribed it. OpenBLAS parallelises its own build.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The from-source OpenBLAS is built by one machine and executed by whatever restores it: a
      # SAPPHIRERAPIDS build restored onto a Milan runner made the linked tests die with SIGILL, so
      # the CPU model is part of the key, as is the profile (this job builds `target/debug`, the
      # test job `target/ci`, and one immutable entry cannot hold both). No prefix fallback: a
      # changed vendor configuration must be a miss, not a reuse of the previous build.
      - id: runner
        run: |
          echo "key=$(lscpu | sed -n 's/^Model name: *//p' | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: target/*/build/openblas-src-*
          key: openblas-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner.outputs.key }}-debug-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.runner.outputs.key }}
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features tlinalg-blas/link-openblas,tlinalg-blas/provider-inject,tlinalg-parity/link-openblas,tlinalg-bench/link-openblas -- -D warnings

      - if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: target/*/build/openblas-src-*
          key: openblas-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner.outputs.key }}-debug-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}

  # The LAPACK kernels need linked symbols. `link-openblas` builds OpenBLAS from source through
  # `openblas-src`, so no system package is required.
  test:
    name: cargo test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # See the `clippy` job for why the vendor cache key carries the CPU model, the profile and no
      # prefix fallback.
      - id: runner
        run: |
          echo "key=$(lscpu | sed -n 's/^Model name: *//p' | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: target/*/build/openblas-src-*
          key: openblas-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner.outputs.key }}-ci-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.runner.outputs.key }}
          save-if: ${{ github.event_name == 'push' }}
      # The C ABI test links the built library, so build the cdylib first (the same
      # prerequisite tcontract-capi documents for its own C test).
      - run: cargo build --profile ci -p tlinalg-capi
      - run: cargo test --workspace --profile ci --features tlinalg-blas/link-openblas,tlinalg-parity/link-openblas
      # The injected symbol set exports ?gesvd but not ?gesdd, so the other driver has to be
      # exercised too; OpenBLAS provides both symbols.
      - run: cargo test --workspace --profile ci --features tlinalg-blas/link-openblas,tlinalg-blas/provider-inject,tlinalg-parity/link-openblas
      # A red gate here has to say which CPU ran it and which vendor build it linked. The linked
      # tests have failed with SIGILL on a runner because the from-source OpenBLAS was built for
      # an ISA that runner cannot execute, and neither fact was visible in the log.
      - name: Host and vendor build (on failure)
        if: failure()
        run: |
          lscpu | head -20
          grep -m1 '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^avx2|^avx512|^fma' | tr '\n' ' '; echo
          find target -name Makefile.conf -path '*openblas*' -exec grep -HE '^(CORE|DYNAMIC_ARCH|NUM_THREADS|NO_AFFINITY)=' {} \; || true
          find target -name 'libopenblas*' | head
      - if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: target/*/build/openblas-src-*
          key: openblas-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner.outputs.key }}-ci-${{ hashFiles('Cargo.lock', '.cargo/config.toml') }}

  # Without a vendor library the faer provider still runs in full and the LAPACK marshalling still
  # has to compile.
  test-unlinked:
    name: cargo test (macos-latest, unlinked)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}
      # As on the Linux lane: the C ABI test links the built library.
      - run: cargo build --profile ci -p tlinalg-capi
      - run: cargo test --workspace --profile ci

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
