[workspace]
members = [
    "crates/tlinalg",
    "crates/tlinalg-blas",
    "crates/tlinalg-testkit",
    "crates/tlinalg-parity",
    "crates/tlinalg-bench",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["Hiroshi Shinaoka <h.shinaoka@gmail.com>", "tensor4all contributors"]
repository = "https://github.com/tensor4all/tlinalg-rs"
publish = false

[workspace.dependencies]
tlinalg = { version = "0.1.0", path = "crates/tlinalg" }
tlinalg-blas = { version = "0.1.0", path = "crates/tlinalg-blas" }
tlinalg-testkit = { path = "crates/tlinalg-testkit" }
# tensor4all's fork of faer, published as `t4a-faer`; the dependency key and `[lib] name` stay
# `faer`, so `use faer::...` and the crates' `faer = { workspace = true }` are unchanged.
faer = { package = "t4a-faer", version = "0.24.4", default-features = false, features = ["std", "rayon"] }
# Published strided-view release; hosts use this exact source to share `RawStridedRef` types.
strided-view = { git = "https://github.com/tensor4all/strided-rs.git", rev = "12ff2de906f4d894a4329f7dbf195b0f874f846e", version = "=0.4.6" }
num-complex = "0.4"
rayon = "1.10"
thiserror = "2"
# LAPACK/BLAS provider only.
lapack = "0.20"
cblas-sys = "0.1"
blas-src = { version = "0.14", default-features = false }
lapack-src = "0.13"
# The vendor itself, referenced directly only so a feature can select `static` or `system`
# through `openblas-src`; `blas-src`/`lapack-src` select the OpenBLAS source for us.
openblas-src = { version = "0.10" }
# Benchmarks only.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.ci]
inherits = "test"
incremental = false
strip = "symbols"
