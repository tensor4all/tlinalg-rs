[workspace]
members = [
    "crates/tlinalg",
    "crates/tlinalg-blas",
    "crates/tlinalg-capi",
    "crates/tlinalg-testkit",
    "crates/tlinalg-parity",
    "crates/tlinalg-bench",
]
resolver = "2"

[workspace.package]
version = "0.4.3"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["Hiroshi Shinaoka <h.shinaoka@gmail.com>", "tensor4all contributors"]
repository = "https://github.com/tensor4all/tlinalg-rs"
publish = false

[workspace.dependencies]
tlinalg = { version = "0.6.0", path = "crates/tlinalg" }
tlinalg-blas = { version = "0.5.0", path = "crates/tlinalg-blas" }
tlinalg-capi = { version = "0.3.1", path = "crates/tlinalg-capi" }
tlinalg-testkit = { path = "crates/tlinalg-testkit" }
# tensor4all's faer fork; the dependency key and `[lib] name` remain `faer`.
# 0.24.8 adds the divide-and-conquer SVD secular-root fix (tensor4all/faer#28)
# to the existing QR/EVD and householder fixes. A compatible range admits later
# patch fixes without republishing tlinalg; tenferro shares this faer identity.
faer = { package = "t4a-faer", version = "0.24.8", default-features = false, features = ["std", "rayon", "threadteam"] }
# `strided-view` is the stride/metadata and `RawStridedRef` surface tlinalg consumes. A registry
# source resolves to one 0.7.x version, so a compatible requirement keeps `RawStridedRef` one type
# without forcing a tlinalg release for every strided patch.
strided-view = { version = "0.7.0" }
# The placement token (formerly `strided-exec`): `threadteam::Exec` / `Pool`.
threadteam = { version = "0.1.0" }
# The `Exec` bundle every entry point takes (a threadteam token, workspace, batch policy) and the
# batch-lane vocabulary. One source with the git-only `tcontract-capi` below, so the forwarded
# `Exec` is the same type the C API takes; `[patch.crates-io]` supplies the unpublished revision.
tcontract-exec = { version = "0.6.0" }
# The C-API glue only (publish = false, so a git-only dependency used by the unpublished
# `tlinalg-capi`). One revision for exec and capi, or the forwarded `Exec` is a different type
# than the one `tlinalg` takes.
tcontract-capi = { git = "https://github.com/tensor4all/tcontract-rs.git", rev = "4ea7f5cbb0347ab8689e112654466b596fdab9c3" }
num-complex = "0.4"
thiserror = "2"
# LAPACK/BLAS provider only.
lapack = "0.20"
cblas-sys = "0.1"
blas-src = { version = "0.14", default-features = false }
lapack-src = "0.13"
# The vendor itself, referenced directly only so a feature can select `static` or `system`
# through `openblas-src`; `blas-src`/`lapack-src` select the OpenBLAS source for us.
openblas-src = { version = "0.10" }
# Benchmarks only.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# Unpublished upstreams: delete the entries once the crates are on crates.io. They are branch
# revs (threadteam-rs, strided-rs, tcontract-rs `feat/dispatch-cost`, faer `exp/par-team-lifetime`)
# that agree on one threadteam rev, so `Exec` and `TeamExec` are single types.
[patch.crates-io]
threadteam = { git = "https://github.com/tensor4all/threadteam-rs.git", rev = "5afe0b4d2ea604d0d8fe6b563bacf4c80f2d0bc4" }
strided-traits = { git = "https://github.com/tensor4all/strided-rs.git", rev = "6821b53e201a9684520ac8458467656143c934f2" }
strided-view = { git = "https://github.com/tensor4all/strided-rs.git", rev = "6821b53e201a9684520ac8458467656143c934f2" }
strided-basic = { git = "https://github.com/tensor4all/strided-rs.git", rev = "6821b53e201a9684520ac8458467656143c934f2" }
strided-perm = { git = "https://github.com/tensor4all/strided-rs.git", rev = "6821b53e201a9684520ac8458467656143c934f2" }
tcontract-exec = { git = "https://github.com/tensor4all/tcontract-rs.git", rev = "4ea7f5cbb0347ab8689e112654466b596fdab9c3" }
t4a-faer = { git = "https://github.com/tensor4all/faer.git", rev = "9cd64f022a275071b64fbd0872e7c1f4d8d51bf9" }
t4a-faer-traits = { git = "https://github.com/tensor4all/faer.git", rev = "9cd64f022a275071b64fbd0872e7c1f4d8d51bf9" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.ci]
inherits = "test"
incremental = false
strip = "symbols"
