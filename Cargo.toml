[workspace]
members = [
    "crates/tlinalg",
    "crates/tlinalg-blas",
    "crates/tlinalg-capi",
    "crates/tlinalg-testkit",
    "crates/tlinalg-parity",
    "crates/tlinalg-bench",
]
resolver = "2"

[workspace.package]
version = "0.4.3"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
authors = ["Hiroshi Shinaoka <h.shinaoka@gmail.com>", "tensor4all contributors"]
repository = "https://github.com/tensor4all/tlinalg-rs"
publish = false

[workspace.dependencies]
tlinalg = { version = "0.4.1", path = "crates/tlinalg" }
tlinalg-blas = { version = "0.4.1", path = "crates/tlinalg-blas" }
tlinalg-capi = { version = "0.3.1", path = "crates/tlinalg-capi" }
tlinalg-testkit = { path = "crates/tlinalg-testkit" }
# tensor4all's fork of faer, consumed by revision: it carries the unpivoted-QR fix for
# tlinalg-rs#28 (faer's QR dropped nearly dependent columns), which upstream 0.24.4 does not have.
# The dependency key and the fork's `[lib] name` both stay `faer`, so `use faer::...` and the
# crates' `faer = { workspace = true }` are unchanged. `t4a-faer 0.24.7` is the fork's release from
# main (evd eigenvector normalization fix, householder row-split/region-floor patches, and the
# row-split gate for tensor4all/faer#12);
# tenferro pins the same version, so the stack shares one faer identity.
faer = { package = "t4a-faer", version = "=0.24.7", default-features = false, features = ["std", "rayon"] }
# Published strided-view 0.6.0 (stride/metadata and the `RawStridedRef` surface tlinalg
# consumes). A registry source resolves to one 0.6.x version, so a compatible requirement keeps
# `RawStridedRef` one type without forcing a tlinalg release for every strided patch.
strided-view = { version = "0.6.0" }
# The batch-lane vocabulary and the `Exec` token every entry point now takes. Pinned to the
# tcontract 0.4.2 release revision so it is *one source* with the git-only `tcontract-capi`
# below: a registry copy would be a distinct package and its `Exec` would not be the same type
# the C API forwards. `version` keeps the manifest publishable — `cargo package` resolves the
# registry release instead of the git source.
tcontract-exec = { git = "https://github.com/tensor4all/tcontract-rs.git", rev = "3256959434e7807b0e217091914d2d2a66d2b9e3", version = "=0.4.2" }
# The C-API glue only: `tlinalg` itself stays free of the contraction stack. It needs
# the TAPP executor handle's guarded `Exec`, which tcontract-capi owns (publish = false, so this
# is a git-only dependency). One revision for exec and capi, or the forwarded `Exec` is a
# different type than the one `tlinalg` takes.
tcontract-capi = { git = "https://github.com/tensor4all/tcontract-rs.git", rev = "3256959434e7807b0e217091914d2d2a66d2b9e3" }
num-complex = "0.4"
rayon = "1.10"
thiserror = "2"
# LAPACK/BLAS provider only.
lapack = "0.20"
cblas-sys = "0.1"
blas-src = { version = "0.14", default-features = false }
lapack-src = "0.13"
# The vendor itself, referenced directly only so a feature can select `static` or `system`
# through `openblas-src`; `blas-src`/`lapack-src` select the OpenBLAS source for us.
openblas-src = { version = "0.10" }
# Benchmarks only.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.ci]
inherits = "test"
incremental = false
strip = "symbols"
