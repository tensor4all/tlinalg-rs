# Only `threadteam` starts tasks on a thread pool. Every other crate of this
# workspace reaches parallelism through `threadteam::Exec`, so a direct
# `rayon` dependency (normal, dev or build) is rejected. The exceptions are the
# third-party crates that bring rayon in themselves: t4a-faer (the one faer
# identity of the stack, which receives a `Par::Team` from a team token;
# how it schedules that team is decided in t4a-faer, tensor4all/faer#59, and `spindle`
# is listed only because t4a-faer 0.24 depends on it today), the gemm crates it
# uses.
[graph]
all-features = true

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = [
    { crate = "rayon", wrappers = [
        "threadteam",
        "t4a-faer",
        "spindle",
        "gemm-common",
        "t4a-private-gemm-x86",
    ] },
    { crate = "rayon-core", wrappers = ["rayon"] },
]
